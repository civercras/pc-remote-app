<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<title>Couchpad</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================================================================ temas */
:root, [data-theme="dark"]{
  --app-bg:#050505; --text:#F2F2F2; --muted:#9A9A9A; --faint:#4A4A4A;
  --font:"Instrument Sans", system-ui, sans-serif; --font-title:var(--font);
  --card-bg:#111111; --card-border:0 solid transparent; --card-shadow:none; --card-r:32px; --blur:none;
  --btn-bg:#1A1A1A; --btn-fg:#F2F2F2; --btn-border:0 solid transparent; --btn-shadow:none; --btn-r:999px; --btn-active:#2C2C2C; --icon:currentColor;
  --danger-bg:#2A1414; --danger-fg:#FF8A80; --danger-border:0 solid transparent;
  --dial-bg:#151515; --dial-fg:#CFCFCF; --dial-border:0 solid transparent; --dial-held-bg:#1F1F1F; --dial-tick:#8A8A8A; --dial-marker:#F2F2F2;
  --pad-bg:#0E0E0E; --pad-border:0 solid transparent; --pad-shadow:none; --pad-r:36px 36px 20px 20px; --strip:#4A4A4A; --strip-line:#222222;
  --click-bg:#151515; --click-fg:#9A9A9A; --click-border:0 solid transparent; --click-shadow:none; --click-active:#262626;
  --fab-bg:#F2F2F2; --fab-fg:#050505; --fab-border:6px solid #050505; --fab-shadow:none;
  --overlay:radial-gradient(circle at var(--fx,50%) var(--fy,90%), rgba(5,5,5,.72) 0, rgba(5,5,5,.93) 300px);
  --item-bg:#1E1E1E; --item-fg:#F2F2F2; --item-border:0 solid transparent; --item-shadow:none; --item-hot-bg:#F2F2F2; --item-hot-fg:#050505;
  --tip-bg:#F2F2F2; --tip-fg:#050505;
  --sheet-bg:#151515; --sheet-border:#262626; --input-bg:#0B0B0B; --input-border:#2A2A2A;
  --accent:#F2F2F2; --accent-fg:#050505; --dot:#4ADE80; --scrim:rgba(0,0,0,.55);
}
[data-theme="aero"]{
  --app-bg:linear-gradient(180deg,#4FB3EC 0%,#9ED9F7 34%,#DDF3FC 58%,#E8F8E4 82%,#A6DC84 100%);
  --text:#0B3954; --muted:#1F4E6B; --faint:#5B8BAA; --font:"Figtree", system-ui, sans-serif;
  --card-bg:linear-gradient(180deg,rgba(255,255,255,.80) 0%,rgba(255,255,255,.48) 100%); --card-border:1px solid rgba(255,255,255,.95);
  --card-shadow:0 10px 28px rgba(20,90,140,.20), inset 0 1px 0 #FFFFFF; --blur:blur(16px);
  --btn-bg:linear-gradient(180deg,#FFFFFF 0%,#F1F9FE 48%,#DDF1FC 52%,#F4FBFE 100%); --btn-fg:#0B3954; --btn-border:1px solid #A9D3EC;
  --btn-shadow:0 2px 5px rgba(20,90,140,.12), inset 0 1px 0 #FFFFFF; --btn-active:linear-gradient(180deg,#DDF1FC,#C4E6FA); --icon:#1683BE;
  --danger-bg:linear-gradient(180deg,#FFD9D6 0%,#FF8A80 48%,#E5484D 52%,#FF9C94 100%); --danger-fg:#3D0707; --danger-border:1px solid #B8322F;
  --dial-bg:linear-gradient(180deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.48) 100%); --dial-fg:#1683BE; --dial-border:1px solid rgba(255,255,255,.95);
  --dial-held-bg:linear-gradient(180deg,#FFFFFF,#E3F4FD); --dial-tick:#7FB3D5; --dial-marker:#1E9FDE;
  --pad-bg:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.30) 100%); --pad-border:1px solid rgba(255,255,255,.95);
  --pad-shadow:0 12px 32px rgba(20,90,140,.20), inset 0 1px 0 #FFFFFF; --strip:#1683BE; --strip-line:#8FE0FF;
  --click-bg:linear-gradient(180deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.52) 100%); --click-fg:#1683BE; --click-border:1px solid rgba(255,255,255,.95);
  --click-shadow:0 6px 16px rgba(20,90,140,.18), inset 0 1px 0 #FFFFFF; --click-active:linear-gradient(180deg,#E3F4FD,#C4E6FA);
  --fab-bg:radial-gradient(circle at 50% 30%,#DFF7FF 0,#7AD6F8 30%,#1E9FDE 62%,#0F7FBF 100%); --fab-fg:#062A44; --fab-border:1px solid #1683BE;
  --fab-shadow:0 6px 18px rgba(22,131,190,.5), inset 0 2px 0 rgba(255,255,255,.9);
  --overlay:radial-gradient(circle at var(--fx,50%) var(--fy,90%), rgba(8,60,100,.35) 0, rgba(8,60,100,.62) 320px);
  --item-bg:radial-gradient(circle at 35% 28%,#FFFFFF 0,#EAF7FE 35%,#BFE6FA 75%,#DDF3FC 100%); --item-fg:#1683BE; --item-border:1px solid rgba(255,255,255,.95);
  --item-shadow:0 6px 16px rgba(8,60,100,.35); --item-hot-bg:radial-gradient(circle at 50% 28%,#DFF7FF 0,#7AD6F8 32%,#1E9FDE 66%,#0F7FBF 100%); --item-hot-fg:#062A44;
  --tip-bg:#FFFFFF; --tip-fg:#0B3954;
  --sheet-bg:linear-gradient(180deg,rgba(255,255,255,.97),rgba(236,248,254,.96)); --sheet-border:#FFFFFF; --input-bg:#FFFFFF; --input-border:#A9D3EC;
  --accent:#1E9FDE; --accent-fg:#062A44; --dot:#3FBF3F; --scrim:rgba(12,70,110,.30);
}
[data-theme="xp"]{
  --app-bg:radial-gradient(140% 50% at 22% 100%,#62AE3D 0 50%,transparent 51%),radial-gradient(120% 42% at 95% 100%,#4F9A2C 0 50%,transparent 51%),linear-gradient(180deg,#2D6BD3 0%,#6FA8EE 45%,#CFE4FA 78%);
  --text:#000000; --muted:#333333; --faint:#7F9DB9; --font:Tahoma, Verdana, "Segoe UI", sans-serif; --font-title:"Trebuchet MS", Tahoma, sans-serif;
  --card-bg:#ECE9D8; --card-border:3px solid #0055E5; --card-shadow:2px 3px 8px rgba(0,0,0,.35); --card-r:8px 8px 3px 3px; --blur:none;
  --btn-bg:linear-gradient(180deg,#FFFFFF 0%,#F3F2EC 70%,#D6D0C5 100%); --btn-fg:#000000; --btn-border:1px solid #003C74;
  --btn-shadow:inset -1px -1px 0 #ACA899; --btn-r:4px; --btn-active:linear-gradient(180deg,#E3E1D8,#F3F2EC); --icon:#0A246A;
  --danger-bg:linear-gradient(180deg,#F6A88F 0%,#E5582F 45%,#C8381C 100%); --danger-fg:#FFFFFF; --danger-border:1px solid #FFFFFF;
  --dial-bg:linear-gradient(180deg,#3A80F3 0%,#245EDC 10%,#2259D6 85%,#1941A5 100%); --dial-fg:#FFFFFF; --dial-border:1px solid #0C3DA8;
  --dial-held-bg:linear-gradient(180deg,#5A98F8,#2E6BE6); --dial-tick:#A9C8FF; --dial-marker:#FFFFFF;
  --pad-bg:#FFFFFF; --pad-border:1px solid #7F9DB9; --pad-shadow:inset 1px 1px 0 #ACA899; --pad-r:3px; --strip:#7F9DB9; --strip-line:#C3D3E6;
  --click-bg:linear-gradient(180deg,#FFFFFF 0%,#F3F2EC 70%,#D6D0C5 100%); --click-fg:#0A246A; --click-border:1px solid #003C74;
  --click-shadow:inset -1px -1px 0 #ACA899; --click-active:linear-gradient(180deg,#E3E1D8,#F3F2EC);
  --fab-bg:linear-gradient(180deg,#6CC36C 0%,#3C9A3C 45%,#2E8B2E 55%,#3FA83F 100%); --fab-fg:#FFFFFF; --fab-border:2px solid #1F6B1F;
  --fab-shadow:2px 2px 4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.6);
  --overlay:rgba(0,0,0,.35);
  --item-bg:linear-gradient(180deg,#FFFFFF 0%,#F3F2EC 70%,#D6D0C5 100%); --item-fg:#0A246A; --item-border:1px solid #003C74;
  --item-shadow:2px 2px 4px rgba(0,0,0,.3); --item-hot-bg:linear-gradient(180deg,#FFF3C4,#F9D776); --item-hot-fg:#000000;
  --tip-bg:#FFFFE1; --tip-fg:#000000;
  --sheet-bg:#ECE9D8; --sheet-border:#0055E5; --input-bg:#FFFFFF; --input-border:#7F9DB9;
  --accent:#316AC5; --accent-fg:#FFFFFF; --dot:#3C9A3C; --scrim:rgba(0,0,0,.35);
}

/* ================================================================ base */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--app-bg);background-attachment:fixed;color:var(--text);font:15px/1.25 var(--font);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;padding:0;margin:0}
svg{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}
#app > *{transition:opacity .2s}
body.dialing #app > :not(#dial){opacity:.3}

header{flex:none;display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 2px 0 6px}
#status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dot{width:9px;height:9px;border-radius:50%;background:#E5484D;flex:none}
#dot.on{background:var(--dot)}
.hbtns{display:flex;align-items:center}
body.fs #btnFs,body.nofs #btnFs{display:none}
[data-theme="xp"] #status,[data-theme="xp"] header .ib svg{color:#FFFFFF;text-shadow:1px 1px 1px rgba(0,0,0,.5)}

.btn{display:flex;align-items:center;justify-content:center;border:var(--btn-border);background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--btn-shadow);border-radius:var(--btn-r);touch-action:manipulation}
.btn svg{color:var(--icon)}
.btn:active,.btn.press{background:var(--btn-active)}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ib:active{background:var(--btn-active)}

/* ---------------- tarjeta de ventana activa */
#card{flex:none;border-radius:var(--card-r);background:var(--card-bg);border:var(--card-border);box-shadow:var(--card-shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:12px;display:flex;flex-direction:column;gap:12px}
.wintop{display:flex;align-items:center;gap:6px}
#cardMain{flex:1;min-width:0;border:0;background:transparent;display:flex;align-items:center;gap:12px;text-align:left;color:var(--text)}
#appIcon{width:44px;height:44px;flex:none;border-radius:var(--btn-r);display:flex;align-items:center;justify-content:center;background:var(--btn-bg);border:var(--btn-border);box-shadow:var(--btn-shadow);color:var(--icon)}
[data-theme="aero"] #appIcon{background:var(--item-hot-bg);color:#062A44;border:1px solid #1683BE}
.appmeta{display:flex;flex-direction:column;gap:2px;min-width:0}
#appName{font:600 16px var(--font-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appsub{color:var(--muted);display:flex}
.wbtn{width:40px;height:40px}
.btn.danger{background:var(--danger-bg);color:var(--danger-fg);border:var(--danger-border)}
.btn.danger svg{color:inherit}
.btn.danger.armed{animation:armed .5s ease-in-out infinite alternate}
@keyframes armed{to{transform:scale(1.12);filter:brightness(1.3)}}
#card.desk .wbtn{opacity:.35;pointer-events:none}
#smart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#smart .btn{height:48px}
[data-theme="xp"] #card{padding:0 0 10px}
[data-theme="xp"] .wintop{padding:4px 5px 4px 8px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#0A5BF0 0%,#3D95FF 9%,#0058EE 40%,#0055E5 86%,#0042C5 100%)}
[data-theme="xp"] #cardMain{color:#FFFFFF}
[data-theme="xp"] #appName{text-shadow:1px 1px 0 #0A246A;font-weight:700}
[data-theme="xp"] .appsub{color:#D6E4FF}
[data-theme="xp"] #appIcon{width:32px;height:32px;background:transparent;border:0;box-shadow:none;color:#FFFFFF}
[data-theme="xp"] .wbtn{width:32px;height:32px;border-radius:3px;border:1px solid #FFFFFF;background:linear-gradient(180deg,#6FA5FF 0%,#3B7BF0 50%,#2A63DA 100%)}
[data-theme="xp"] .wbtn svg{color:#FFFFFF}
[data-theme="xp"] .wbtn.danger{background:var(--danger-bg)}
[data-theme="xp"] #smart{padding:0 10px}

/* ---------------- dial */
.dial{flex:none;position:relative;height:56px;border-radius:var(--btn-r);background:var(--dial-bg);border:var(--dial-border);color:var(--dial-fg);box-shadow:var(--btn-shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;transition:background .15s,box-shadow .15s}
.dial .dicon{transition:opacity .15s,transform .15s}
.dial .ticks{position:absolute;left:22px;right:22px;top:17px;bottom:17px;opacity:0;background:repeating-linear-gradient(90deg,var(--dial-tick) 0 2px,transparent 2px 10px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);transition:opacity .15s}
.dial .marker{position:absolute;left:50%;top:11px;width:4px;height:34px;margin-left:-2px;border-radius:999px;background:var(--dial-marker);opacity:0;box-shadow:0 0 10px var(--dial-marker);transition:opacity .15s}
.dial.held{background:var(--dial-held-bg);box-shadow:0 0 0 6px rgba(128,128,128,.16),0 10px 30px rgba(0,0,0,.35)}
.dial.held .ticks,.dial.held .marker{opacity:1}
.dial.held .dicon{opacity:0;transform:scale(.6)}

/* ---------------- trackpad */
#pad{flex:1;min-height:120px;position:relative;overflow:hidden;border-radius:var(--pad-r);background:var(--pad-bg);border:var(--pad-border);box-shadow:var(--pad-shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);touch-action:none}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--faint);font-size:12px;line-height:1.8;padding:24px 40px;pointer-events:none;transition:opacity .4s}
.strip{position:absolute;right:6px;top:16px;bottom:16px;width:22px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--strip);pointer-events:none}
.strip i{flex:1;width:3px;border-radius:3px;background:var(--strip-line);transition:background .15s}
#pad.edge .strip i{background:var(--strip)}
body.left .strip{right:auto;left:6px}
body.left .wintop{flex-direction:row-reverse}
body.left #cardMain{flex-direction:row-reverse;text-align:right}

/* ---------------- clics y botón radial */
#clicks{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;height:84px}
.click{border:var(--click-border);background:var(--click-bg);color:var(--click-fg);box-shadow:var(--click-shadow);border-radius:var(--btn-r);display:flex;align-items:center;touch-action:none}
#bl{justify-content:flex-start;padding-left:30px}
#br{justify-content:flex-end;padding-right:30px}
.click.act{background:var(--click-active)}
#fab{position:fixed;z-index:20;left:calc(50% - 36px);bottom:calc(22px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;border:var(--fab-border);background:var(--fab-bg);color:var(--fab-fg);box-shadow:var(--fab-shadow);display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
#fab:active{transform:scale(.94)}
#fab .x{display:none}
body.radial #fab .x{display:block}
body.radial #fab .dots{display:none}

/* ---------------- menú radial */
#radial{position:fixed;inset:0;z-index:15;display:none;background:var(--overlay);opacity:0;transition:opacity .18s;touch-action:none}
#radial.open{display:block}
#radial.show{opacity:1}
.ritem{position:absolute;width:60px;height:60px;border-radius:50%;border:var(--item-border);background:var(--item-bg);color:var(--item-fg);box-shadow:var(--item-shadow);display:flex;align-items:center;justify-content:center;opacity:0;transform:translate(var(--ox),var(--oy)) scale(.3);transition:transform .45s cubic-bezier(.34,1.56,.64,1) var(--delay),opacity .2s var(--delay),background .12s;touch-action:none}
#radial.show .ritem{opacity:1;transform:none}
#radial.show .ritem.hot{transform:scale(1.18);background:var(--item-hot-bg);color:var(--item-hot-fg)}
#rlabel{position:absolute;padding:4px 12px;border-radius:999px;background:var(--tip-bg);color:var(--tip-fg);font:600 13px var(--font);white-space:nowrap;pointer-events:none;display:none;transform:translateX(-50%)}
#volbar{position:absolute;width:72px;height:220px;border-radius:36px;overflow:hidden;background:var(--item-bg);border:var(--item-border);box-shadow:var(--item-shadow);display:none;touch-action:none;
  transform:translateX(-50%) scale(.85);opacity:0;transform-origin:50% 100%;transition:opacity .18s,transform .3s cubic-bezier(.34,1.56,.64,1)}
#volbar.on{display:block}
#volbar.show{opacity:1;transform:translateX(-50%) scale(1)}
.vb-fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v,0) * 1%);background:var(--item-hot-bg);transition:height .1s,opacity .2s}
#volbar.muted .vb-fill{opacity:.3}
#volval{position:absolute;transform:translateX(-50%);padding:4px 12px;border-radius:999px;background:var(--tip-bg);color:var(--tip-fg);font:600 13px var(--font);white-space:nowrap;display:none;pointer-events:none}

/* ---------------- ventanas al girar el dial */
#winflow{position:fixed;left:0;right:0;height:150px;z-index:24;pointer-events:none;opacity:0;transform:translateY(8px) scale(.97);
  transition:opacity .2s,transform .28s cubic-bezier(.2,.8,.2,1);--wf-bg:#1C1C1C;--wf-fg:var(--text)}
#winflow.on{opacity:1;transform:none}
[data-theme="aero"] #winflow{--wf-bg:#FFFFFF}
[data-theme="xp"] #winflow{--wf-bg:#ECE9D8}
#winflow.cine{--wf-bg:#1C1C1C;--wf-fg:#F2F2F2}
.wf-track{position:relative;height:108px;overflow:visible}
.wf-item{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:26px;background:var(--wf-bg);box-shadow:0 12px 30px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;transform:translateX(calc(var(--d) * 108px)) scale(var(--s));opacity:var(--o);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .34s}
[data-theme="xp"] .wf-item{border-radius:6px;border:1px solid #7F9DB9}
.wf-item img{width:50px;height:50px;display:block}
.wf-item .lt{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFF;font:700 26px var(--font)}
.wf-name{text-align:center;font:600 14px var(--font);color:var(--wf-fg);padding:4px 28px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------------- botón para escribir cuando hay un cuadro de texto activo en el PC */
#kbdchip{position:fixed;left:50%;z-index:27;height:50px;padding:0 22px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;gap:8px;font:600 15px var(--font);box-shadow:0 10px 28px rgba(0,0,0,.35);
  transform:translate(-50%,16px) scale(.9);opacity:0;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
#kbdchip.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#kbdchip::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid var(--accent);opacity:0;animation:tpulse 1.8s ease-out infinite}
[data-theme="xp"] #kbdchip{border-radius:4px}
.bubble{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.85);background:radial-gradient(circle at 30% 28%,#FFFFFF 0,rgba(255,255,255,.35) 30%,rgba(170,225,250,.25) 70%,rgba(255,255,255,.6) 100%);pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.3);opacity:0}15%{opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1);opacity:0}}

/* ---------------- globo de ayuda y aviso */
#tip{position:fixed;z-index:60;display:none;padding:6px 12px;border-radius:999px;background:var(--tip-bg);color:var(--tip-fg);font:600 13px var(--font);box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap}
[data-theme="xp"] #tip{border-radius:3px;border:1px solid #000;font-weight:400}
#toast{position:fixed;z-index:70;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);padding:10px 16px;border-radius:999px;background:var(--tip-bg);color:var(--tip-fg);font:600 14px var(--font);box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center}
#toast{opacity:0;visibility:hidden;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s,visibility .3s}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}

/* ---------------- hojas inferiores */
#scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:84dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet-bg);border-top:1px solid var(--sheet-border);border-radius:28px 28px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);user-select:none}
#sheet.open{transform:none}
[data-theme="xp"] #sheet{border-radius:8px 8px 0 0;border:3px solid #0055E5;border-bottom:0}
.grab{width:40px;height:5px;border-radius:5px;background:var(--faint);opacity:.6;margin:2px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font:600 20px var(--font-title)}
[data-theme="xp"] .sheet-head{margin:-8px -16px 12px;padding:4px 6px 4px 12px;background:linear-gradient(180deg,#0A5BF0 0%,#3D95FF 9%,#0058EE 40%,#0055E5 86%,#0042C5 100%);color:#FFF}
[data-theme="xp"] .grab{display:none}
[data-theme="xp"] .sheet-head h2{font-size:16px;font-weight:700;text-shadow:1px 1px 0 #0A246A}
[data-theme="xp"] .sheet-head .ib{color:#FFF}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.appb{height:64px;flex-direction:column;gap:4px;font-size:12px;padding:4px 8px;text-align:center;line-height:1.15}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.keys .btn{height:48px;font-size:18px}
#txt{width:100%;height:64px;resize:none;border-radius:20px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font:16px var(--font);padding:10px 14px;user-select:text;-webkit-user-select:text;outline:none}
[data-theme="xp"] #txt{border-radius:0}
.txtrow{display:grid;grid-template-columns:1fr 1fr 64px;gap:6px;margin-top:8px}
.txtrow .btn{height:48px}
.sect{margin:18px 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sect:first-of-type{margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-size:15px}
.row.col{flex-direction:column;align-items:stretch;gap:6px;padding:6px 0}
.row .lab{display:flex;justify-content:space-between;color:var(--text)}
.row .lab span{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.tog{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:var(--input-border);position:relative;flex:none;transition:background .2s;margin:0}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#FFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog:checked{background:var(--accent)}
.tog:checked::after{transform:translateX(20px)}
[data-theme="xp"] .tog{border-radius:3px}[data-theme="xp"] .tog::after{border-radius:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--input-bg);border:1px solid var(--input-border)}
.seg button{flex:1;height:38px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px}
.seg button.sel{background:var(--accent);color:var(--accent-fg);font-weight:600}
.seg.icons{border-radius:30px}
.seg.icons button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;border-radius:24px}
.note{font-size:12px;color:var(--muted);line-height:1.5;padding:4px 2px 6px}
[data-theme="xp"] .seg,[data-theme="xp"] .seg button{border-radius:3px}
select{width:100%;height:44px;border-radius:999px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font:15px var(--font);padding:0 14px}
[data-theme="xp"] select{border-radius:0}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wide{width:100%;height:48px;margin-top:8px;font-size:15px}
.about{margin-top:22px;text-align:center;color:var(--faint);font-size:12px;padding:10px}

/* ---------------- vista de pantalla */
#screen{position:fixed;inset:0;z-index:25;background:#000;color:#F2F2F2;display:none;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 8px calc(12px + env(safe-area-inset-bottom));gap:8px}
#screen.open{display:flex}
#screen .shead{display:flex;align-items:center;gap:8px;flex:none}
#screen .shead .ib{background:#151515;color:#F2F2F2}
#scrTitle{flex:1;font:600 16px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stagewrap{flex:1;position:relative;overflow:hidden;touch-action:none;border-radius:12px;background:#0A0A0A}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
#scrimg{width:100%;height:100%;object-fit:contain;display:block}
#scrmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9A9A9A;font-size:14px;pointer-events:none;text-align:center;padding:24px}
#loupe{position:absolute;width:130px;height:130px;border-radius:50%;border:3px solid #F2F2F2;box-shadow:0 8px 24px rgba(0,0,0,.6);background-color:#000;background-repeat:no-repeat;display:none;pointer-events:none}
#loupe::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.35)}
.ripple{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px solid #F2F2F2;pointer-events:none;animation:ripple .45s ease-out forwards}
@keyframes ripple{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
/* la vista de pantalla es siempre oscura ("modo cine"), sea cual sea el tema */
#screen{--btn-bg:#151515;--btn-fg:#F2F2F2;--btn-border:0 solid transparent;--btn-shadow:none;--btn-active:#2C2C2C;--btn-r:999px;--icon:#F2F2F2;
  --dial-bg:#151515;--dial-fg:#CFCFCF;--dial-border:0 solid transparent;--dial-held-bg:#232323;--dial-tick:#8A8A8A;--dial-marker:#F2F2F2;--font-title:var(--font)}
#scrTitle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font:600 15px var(--font)}
#scrName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrIcon{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:#CFCFCF}
#scrIcon img{width:22px;height:22px}
.smid{flex:1;min-height:0;min-width:0;display:flex;gap:6px}
.smid #stagewrap{min-width:0}
.sstrip{flex:none;width:30px;border-radius:999px;background:#0E0E0E;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;color:#5A5A5A;touch-action:none}
.sstrip i{flex:1;width:3px;border-radius:3px;background:#262626;transition:background .15s}
.sstrip.act{background:#151515}
.sstrip.act i{background:#F2F2F2}
.sdock{flex:none;display:flex;flex-direction:column;gap:8px}
#ssmart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#ssmart .btn{height:50px}
.srow{display:flex;gap:8px}
.srow #sdial{flex:1}
#scrKbd.btn{width:56px;height:56px;flex:none}
#sdial{height:56px}
@media (orientation:landscape){
  #screen{flex-direction:row}
  #screen .shead{flex-direction:column;width:48px}
  #scrTitle{display:none}
  .sdock{width:64px;flex:none;min-height:0}
  #ssmart{grid-template-columns:1fr;flex:none}
  #ssmart .btn{height:42px}
  .srow{flex-direction:column;flex:1;min-height:0}
  #scrKbd.btn{width:100%;height:42px;order:-1}
  #sdial{flex:1;height:auto;min-height:96px}
  #sdial .ticks{left:17px;right:17px;top:22px;bottom:22px;background:repeating-linear-gradient(180deg,var(--dial-tick) 0 2px,transparent 2px 10px);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(180deg,transparent,#000 25%,#000 75%,transparent)}
  #sdial .marker{left:11px;right:11px;top:50%;width:auto;height:4px;margin:-2px 0 0}
}

/* ---------------- icono real y transiciones al cambiar de app */
#appIcon img{width:30px;height:30px;display:block}
#appIcon.real{background:var(--btn-bg)}
[data-theme="aero"] #appIcon.real{background:#FFFFFF;border:1px solid rgba(255,255,255,.95)}
[data-theme="xp"] #appIcon img{width:24px;height:24px}
.swap{animation:swap .34s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#smart .btn{animation:pop .36s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* ---------------- brillo bajo el dedo en el trackpad */
#glow{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle,rgba(255,255,255,.07) 0,rgba(255,255,255,0) 70%)}
[data-theme="aero"] #glow{background:radial-gradient(circle,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 70%)}
[data-theme="xp"] #glow{background:radial-gradient(circle,rgba(49,106,197,.16) 0,rgba(49,106,197,0) 70%)}
#pad.touching #glow{opacity:1}

/* ---------------- cielo animado (Aero y Luna) */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
[data-theme="aero"] #sky,[data-theme="xp"] #sky{display:block}
#app{z-index:1}
.cloud{position:absolute;left:-40%;width:var(--w);height:calc(var(--w) * .38);border-radius:50%;background:rgba(255,255,255,.55);filter:blur(18px);animation:drift var(--t) linear infinite;animation-delay:var(--d)}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:55%;height:120%;left:15%;top:-45%}
.cloud::after{width:45%;height:100%;left:48%;top:-30%}
[data-theme="xp"] .cloud{background:rgba(255,255,255,.85);filter:blur(10px)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(190vw)}}
.floaty{position:absolute;bottom:-40px;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:radial-gradient(circle at 30% 28%,#FFF 0,rgba(255,255,255,.3) 25%,rgba(170,225,250,.15) 65%,rgba(255,255,255,.55) 100%);animation:floatup var(--t) ease-in infinite;animation-delay:var(--d)}
[data-theme="xp"] .floaty{display:none}
@keyframes floatup{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--x),-110vh);opacity:0}}

/* ---------------- sección TV */
.tvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;height:96px;border-radius:28px;flex-direction:column;gap:8px;font-size:12px;padding:8px 6px;line-height:1.15;text-align:center}
[data-theme="xp"] .tile{border-radius:4px}
.tile .ti{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FFFFFF;flex:none}
.tile .ti img{width:32px;height:32px;display:block}
.tile .ti.letter{color:#FFFFFF;font:700 20px var(--font)}
.tile .tn{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.add{background:transparent;border:2px dashed var(--faint);box-shadow:none;color:var(--muted)}
.tile.add .ti{background:transparent;color:var(--muted)}
.tile .del{position:absolute;top:-6px;right:-4px;width:30px;height:30px;border-radius:50%;border:0;background:#E5484D;color:#FFF;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.editing .tile .del{display:flex}
.editing .tile:not(.add){animation:wiggle .28s ease-in-out infinite alternate}
.editing .tile:nth-child(2n){animation-delay:-.14s}
@keyframes wiggle{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.tvhint{margin-top:14px;text-align:center;font-size:12px;color:var(--muted)}
.cat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.form input{height:48px;border-radius:999px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font:16px var(--font);padding:0 18px;user-select:text;-webkit-user-select:text;outline:none}
[data-theme="xp"] .form input{border-radius:0}
.backrow{display:flex;align-items:center;gap:6px;margin:-4px 0 8px;color:var(--muted);font-size:14px;border:0;background:transparent;height:40px}

/* ---------------- energía */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ptile{position:relative;overflow:hidden;height:112px;border-radius:32px;flex-direction:column;gap:8px;font-size:14px;touch-action:none}
[data-theme="xp"] .ptile{border-radius:4px}
.ptile svg,.ptile span:not(.fill){position:relative}
.ptile .fill{position:absolute;inset:0;background:currentColor;opacity:.16;transform-origin:left center;transform:scaleX(var(--p,0))}
.ptile.danger{color:var(--danger-fg)}
.ptile.danger svg{color:inherit}
[data-theme="aero"] .ptile.danger,[data-theme="xp"] .ptile.danger{color:#B8322F}
.ptile.holding{transform:scale(.97)}
.pcount{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 8px;font:600 18px var(--font-title)}
.pcount svg{color:var(--danger-fg)}
[data-theme="aero"] .pcount svg,[data-theme="xp"] .pcount svg{color:#B8322F}


/* ---------------- trackpad ajustable: barra para encogerlo y acercar todo al pulgar */
#reach{flex:none;height:var(--reach,0px)}
#hint{display:none}
#grip{position:absolute;left:50%;top:0;width:110px;height:32px;margin-left:-55px;z-index:3;border:0;background:transparent;display:flex;align-items:center;justify-content:center;touch-action:none}
#grip i{display:block;width:40px;height:5px;border-radius:5px;background:var(--faint);opacity:.55;transition:width .2s,opacity .2s,background .2s}
#grip.pressing i{width:60px;opacity:.9;transition:width .4s linear,opacity .4s}
#grip.act i{width:60px;opacity:1;background:var(--accent)}

/* ---------------- inicio en horizontal: tarjeta y dial a la izquierda, trackpad a la derecha */
@media (orientation:landscape){
  #app{display:grid;grid-template-columns:minmax(0,1fr) var(--rw,50vw);grid-template-rows:auto auto auto 1fr auto;column-gap:12px;row-gap:8px;
    padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
  #reach{display:none}
  header{grid-column:1;grid-row:1}
  #card{grid-column:1;grid-row:2}
  #dial{grid-column:1;grid-row:3}
  #pad{grid-column:2;grid-row:1 / 5;min-height:0}
  #clicks{grid-column:2;grid-row:5;height:64px}
  #fab{left:auto;right:calc(12px + env(safe-area-inset-right) + var(--rw,50vw) / 2 - 36px);bottom:calc(10px + env(safe-area-inset-bottom))}
  #grip{left:0;top:50%;width:34px;height:110px;margin:-55px 0 0 0}
  #grip i{width:5px;height:40px;transition:height .2s,opacity .2s,background .2s}
  #grip.pressing i{width:5px;height:60px;transition:height .4s linear,opacity .4s}
  #grip.act i{width:5px;height:60px}
}

@media (orientation:landscape){
  body.padleft #app{grid-template-columns:var(--rw,50vw) minmax(0,1fr)}
  body.padleft header,body.padleft #card,body.padleft #dial{grid-column:2}
  body.padleft #pad,body.padleft #clicks{grid-column:1}
  body.padleft #fab{right:auto;left:calc(12px + env(safe-area-inset-left) + var(--rw,50vw) / 2 - 36px)}
  body.padleft #grip{left:auto;right:0}
}

/* ---------------- tutorial */
#tut{position:fixed;inset:0;z-index:90;display:none;pointer-events:none}
#tblock{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#tcard{pointer-events:auto}
#tcard.tried #tnext{animation:tnudge 1s ease-in-out infinite}
@keyframes tnudge{50%{transform:scale(1.08)}}
/* durante el tutorial se puede usar la app: lo que se abre aparece por encima de la capa oscura */
body.tut #radial{z-index:92} body.tut.tut-fab #fab{z-index:93}
body.tut #screen{z-index:94} body.tut #scrim{z-index:95} body.tut #sheet{z-index:96}
body.tut #winflow{z-index:97} body.tut #kbdchip{z-index:97} body.tut #toast,body.tut #tip{z-index:98}
#tut.on{display:block}
#tspot{position:absolute;box-shadow:0 0 0 200vmax rgba(0,0,0,.76);pointer-events:none;
  transition:left .5s cubic-bezier(.34,1.25,.64,1),top .5s cubic-bezier(.34,1.25,.64,1),width .5s cubic-bezier(.34,1.25,.64,1),height .5s cubic-bezier(.34,1.25,.64,1),border-radius .5s}
#tspot::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid rgba(255,255,255,.9);animation:tpulse 1.6s ease-out infinite}
@keyframes tpulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.07)}}
#tfinger{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #FFF;box-shadow:0 0 22px rgba(255,255,255,.55);opacity:0}
#tcard{position:absolute;left:16px;right:16px;padding:20px 20px 14px;border-radius:30px;background:var(--tip-bg);color:var(--tip-fg);box-shadow:0 14px 44px rgba(0,0,0,.45);
  transition:top .5s cubic-bezier(.34,1.25,.64,1),opacity .2s}
[data-theme="xp"] #tcard{border-radius:6px;border:1px solid #000}
#tcard .tstep{font:600 12px var(--font);letter-spacing:.06em;text-transform:uppercase;opacity:.55;margin-bottom:6px}
#tcard h3{margin:0 0 6px;font:700 22px/1.15 var(--font-title)}
#tcard p{margin:0;font-size:15px;line-height:1.45;opacity:.85}
#tcard.swap h3,#tcard.swap p,#tcard.swap .tstep{animation:swap .35s cubic-bezier(.2,.8,.2,1)}
.trow{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:8px}
.tdots{display:flex;gap:6px;align-items:center}
.tdots i{display:block;width:7px;height:7px;border-radius:4px;background:currentColor;opacity:.22;transition:width .3s,opacity .3s}
.tdots i.on{opacity:1;width:22px}
.tbtns{display:flex;gap:4px;align-items:center}
#tskip{border:0;background:transparent;color:inherit;opacity:.6;height:44px;padding:0 12px;font:500 14px var(--font)}
#tnext{border:0;height:46px;padding:0 24px;border-radius:999px;background:var(--tip-fg);color:var(--tip-bg);font:600 15px var(--font)}
[data-theme="xp"] #tnext{border-radius:4px;background:#316AC5;color:#FFF}
.f-move{animation:fmove 3.2s ease-in-out infinite}
@keyframes fmove{0%{left:28%;top:62%;opacity:0;transform:scale(1)}8%{opacity:1}36%{left:72%;top:32%}56%{left:46%;top:46%;transform:scale(1)}63%{transform:scale(.7)}71%{transform:scale(1)}90%{opacity:1}100%{left:46%;top:46%;opacity:0}}
.f-click{animation:fclick 2.6s ease-in-out infinite}
@keyframes fclick{0%{left:22%;top:50%;opacity:0;transform:scale(1)}12%{opacity:1}26%{transform:scale(.7)}40%{transform:scale(1);left:22%}58%{left:78%;transform:scale(1)}70%{transform:scale(.7)}84%{transform:scale(1);opacity:1}100%{left:78%;opacity:0}}
.f-dial{animation:fdial 3s ease-in-out infinite}
@keyframes fdial{0%{left:50%;top:50%;opacity:0;transform:scale(1)}12%{opacity:1;transform:scale(.78)}30%{left:50%}55%{left:82%}80%{left:22%;opacity:1}100%{left:22%;opacity:0;transform:scale(.78)}}
.f-tap{animation:ftap 2.2s ease-in-out infinite}
@keyframes ftap{0%{left:16%;top:28%;opacity:0;transform:scale(1)}20%{opacity:1}38%{transform:scale(.7)}52%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.f-radial{animation:fradial 3s ease-in-out infinite}
@keyframes fradial{0%{left:50%;top:50%;opacity:0;transform:scale(1)}12%{opacity:1;transform:scale(.78)}38%{left:50%;top:50%}74%{left:-70%;top:-140%;opacity:1}100%{left:-70%;top:-140%;opacity:0}}
.f-drag{animation:fdrag 2.6s ease-in-out infinite}
@keyframes fdrag{0%{left:50%;top:50%;opacity:0;transform:scale(1)}15%{opacity:1;transform:scale(.78)}70%{top:520%;opacity:1}100%{top:520%;opacity:0}}

/* ---------------- sliders que no se mueven al desplazar la hoja */
.rng{position:relative;touch-action:pan-y;padding:6px 0}
.rng input{pointer-events:none}
.rng.drag input{filter:brightness(1.15)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .cloud,.floaty{display:none}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true">

function tr(s, ...a){

  return a.length ? r.replace(/\{(\d)\}/g, (_, i) => a[i]) : r;
}

// Vibraciones: cada acción tiene su patrón para reconocerla sin mirar el móvil
// (número = vibrar N ms; lista = vibrar, pausa, vibrar…)
const HAP = {
  press:18, click:16, right:[16,55,16], middle:[14,45,14,45,14], grab:[10,30,32], drop:14,
  tick:12, gesture:[22,40,32], open:20, hover:12, select:[28,40,14],
  warn:[32,70,32], close:[38,50,75], error:[70,90,70,90,70], edge:12, unlock:[35,45,35,45,90],
};
function buzz(p){
  if (!S.haptic || !navigator.vibrate) return;
  if (p === 0) return;
  if (p == null) p = HAP.press;
  const k = S.hapStr || 1;
  const pat = (Array.isArray(p) ? p : [p]).map((v, i) => i % 2 ? v : Math.max(1, Math.round(v * k)));
  try { navigator.vibrate(pat.length === 1 ? pat[0] : pat); } catch(e){}
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dialStep = () => 60 - (S.dialSens - 1) * 9;

function applyTheme(){
  let t = S.theme;
  if (t === "xp" && !S.xp) t = "auto";
  if (t === "auto") t = matchMedia("(prefers-color-scheme: light)").matches ? "aero" : "dark";
  document.documentElement.dataset.theme = t;
  document.body.classList.toggle("left", !!S.left);
  document.body.classList.toggle("padleft", S.padSide === "left");
  $('meta[name="theme-color"]').content = {dark:"#050505", aero:"#4FB3EC", xp:"#2D6BD3"}[t];
}

/* ================================================================ conexión */
const qs = new URLSearchParams(location.search);
let token = qs.get("k") || load("mando.token") || "";
if (qs.get("k")) save("mando.token", token);
let ws = null, retry = 0, fatal = false, wasOn = false, CFG = {apps:[], shortcuts:[], host:"", screen:false};

function setStatus(txt, on){ $("#statusText").textContent = txt; $("#dot").classList.toggle("on", !!on); }
function connect(){
  if (fatal) return;
  setStatus(tr("Conectando…"), false);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?k=${encodeURIComponent(token)}`);
  ws.onopen = () => { retry = 0; wasOn = true; setStatus(tr("Conectado"), true); loadConfig(); if (S.halo) send({t:"halo", on:true}); };
  ws.onmessage = e => { try {
    const m = JSON.parse(e.data);
    if (m.t === "win") setWindow(m);
    else if (m.t === "wins") wfSet(m.list || []);
    else if (m.t === "caret") onCaret(!!m.on);
    else if (m.t === "vol") onVol(m);
  } catch(err){} };
  ws.onclose = e => {
    if (e.code === 4001){ fatal = true; setStatus(tr("Código incorrecto: escanea de nuevo el QR del PC"), false); return; }
    if (wasOn){ wasOn = false; buzz(HAP.error); }
    setStatus(tr("Sin conexión, reintentando…"), false);
    setTimeout(connect, Math.min(4000, 400 * (++retry)));
  };
}
function send(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
const sendKeys = keys => send({t:"k", k: keys.split("+")});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
});
function loadConfig(){
  fetch(`/config?k=${encodeURIComponent(token)}`).then(r => r.json()).then(c => {
    CFG = c;
    if (c.host) setStatus(tr("Conectado") + " · " + c.host, true);
    tryFixedName();
  }).catch(() => {});
}

// Nombre fijo: si la página se abrió por IP y el PC se anuncia como <nombre>.local, se salta allí
// para que el acceso directo del móvil siga funcionando aunque el router cambie la IP del PC.
let hopTried = false;
async function tryFixedName(){
  if (hopTried || !CFG.mdns || !CFG.id || !/^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)) return;
  hopTried = true;
  const base = `http://${CFG.mdns}:${location.port || 80}`;
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2500);
    const r = await fetch(base + "/ping", {signal: ctl.signal, cache: "no-store"});
    const d = await r.json();
    if (d.id !== CFG.id) return;                       // otro PC con el mismo nombre: no saltar
  } catch(e){ return; }                                // este móvil no resuelve .local: seguir por IP
  const keep = {};
  try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (/^mando\./.test(k) && k !== "mando.token") keep[k] = localStorage.getItem(k); } } catch(e){}
  const m = btoa(unescape(encodeURIComponent(JSON.stringify(keep))));
  location.replace(`${base}/?k=${encodeURIComponent(token)}&m=${encodeURIComponent(m)}`);
}

/* ================================================================ bucle de envío (un mensaje por frame) */
let mx = 0, my = 0, sx = 0, sy = 0, inertia = null, lastFrame = performance.now();
function frame(now){
  const dt = Math.min(50, now - lastFrame); lastFrame = now;
  const ix = Math.trunc(mx), iy = Math.trunc(my);
  if (ix || iy){ send({t:"m", x:ix, y:iy}); mx -= ix; my -= iy; }
  if (inertia){
    sx += inertia.x * dt; sy += inertia.y * dt;
    const f = Math.pow(0.94, dt / 16); inertia.x *= f; inertia.y *= f;
    if (Math.hypot(inertia.x, inertia.y) < 0.002) inertia = null;
  }
  if (Math.abs(sx) > 0.005 || Math.abs(sy) > 0.005){ send({t:"s", x:+sx.toFixed(3), y:+sy.toFixed(3)}); sx = sy = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================================================================ globos de ayuda (mantener pulsado) */
const tipEl = $("#tip"); let tipTimer = null, tipHide = null;
function showTip(el, text){
  const r = el.getBoundingClientRect();
  tipEl.textContent = text; tipEl.style.display = "block";
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + "px";
  tipEl.style.top = Math.max(8, r.top - th - 10) + "px";
  clearTimeout(tipHide); tipHide = setTimeout(hideTip, 1800);   // nunca se queda puesto
}
function hideTip(){ tipEl.style.display = "none"; }
// Al levantar el dedo en cualquier sitio, el globo se va enseguida; al tocar otra cosa, al instante
document.addEventListener("touchend", () => {
  if (tipEl.style.display === "block"){ clearTimeout(tipHide); tipHide = setTimeout(hideTip, 700); }
}, {capture: true, passive: true});
document.addEventListener("touchcancel", () => { clearTimeout(tipHide); tipHide = setTimeout(hideTip, 300); }, {capture: true, passive: true});
document.addEventListener("touchstart", () => hideTip(), {capture: true, passive: true});
function tipify(el){
  el.addEventListener("touchstart", () => {
    el._tipped = false; clearTimeout(tipTimer); clearTimeout(tipHide);
    tipTimer = setTimeout(() => { el._tipped = true; showTip(el, el.getAttribute("aria-label")); buzz(HAP.hover); }, 450);
  }, {passive:true});
  el.addEventListener("touchmove", () => clearTimeout(tipTimer), {passive:true});
  const end = () => { clearTimeout(tipTimer); if (el._tipped) tipHide = setTimeout(hideTip, 1000); };
  el.addEventListener("touchend", end); el.addEventListener("touchcancel", end);
  el.addEventListener("contextmenu", e => e.preventDefault());
}
function onTap(el, fn){
  tipify(el);
  el.addEventListener("click", e => { if (el._tipped){ el._tipped = false; return; } buzz(el.id === "wClose" ? 0 : HAP.press); fn(e); });
}
function iconBtn(label, icon, fn, cls = "btn"){
  const b = document.createElement("button");
  b.className = cls; b.setAttribute("aria-label", label); b.innerHTML = svg(icon);
  onTap(b, fn); return b;
}

const badIcons = new Set();

function classify(w){
  let [name, cat] = APPS[w.exe] || (/^stremio/.test(w.exe) || /^stremio\b/i.test(w.title) ? ["Stremio", "stremio"] : [null, "default"]);

    else { name = w.exe.replace(/\.exe$/, ""); name = name.charAt(0).toUpperCase() + name.slice(1); }

  if (cat === "browser" && /spotify/i.test(w.title)) set = "media";
  return {name, cat, set};
}

function replay(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function setAppIcon(c){

  fallback();                                   // mientras carga, el icono genérico
  img.src = `/appicon/${encodeURIComponent(exe)}?k=${encodeURIComponent(token)}`;
}

/* ================================================================ dial (Alt+Tab) */
function initDial(){ bindDial($("#dial"), true); bindDial($("#sdial"), false); }
function bindDial(d, dimOthers){
  d.querySelector(".dicon").innerHTML = svg("windows", 26, 1.8);
  const ticks = d.querySelector(".ticks");
  let timer = null, hold = false, x0 = 0, last = 0, acc = 0, vert = false;
  const pos = t => vert ? t.clientY : t.clientX;     // en horizontal el dial es vertical: se desliza arriba/abajo
  const startHold = () => {
    if (hold) return;
    hold = true; send({t:"at", a:"start"}); buzz(HAP.grab);
    d.classList.add("held"); if (dimOthers) document.body.classList.add("dialing");
    wfShow(d);
  };
  d.addEventListener("touchstart", e => {
    e.preventDefault(); vert = d.clientHeight > d.clientWidth * 1.2;
    x0 = last = pos(e.targetTouches[0]); acc = 0; hold = false;
    timer = setTimeout(startHold, 220);
  }, {passive:false});
  d.addEventListener("touchmove", e => {
    e.preventDefault();
    const x = pos(e.targetTouches[0]);
    if (!hold && Math.abs(x - x0) > 12){ clearTimeout(timer); startHold(); }
    if (!hold) return;
    acc += x - last; last = x;
    ticks.style.backgroundPosition = vert ? `0 ${x - x0}px` : `${x - x0}px 0`;
    const st = dialStep();
    while (acc >= st){ send({t:"at", a:"next"}); acc -= st; buzz(HAP.tick); wfStep(1); }
    while (acc <= -st){ send({t:"at", a:"prev"}); acc += st; buzz(HAP.tick); wfStep(-1); }
  }, {passive:false});
  const end = e => {
    e.preventDefault(); clearTimeout(timer);
    if (hold){ send({t:"at", a:"end"}); buzz(HAP.drop); wfHide(); d.classList.remove("held"); document.body.classList.remove("dialing"); ticks.style.backgroundPosition = "0 0"; }
    else { sendKeys("alt+tab"); buzz(HAP.click); }
    hold = false;
  };
  d.addEventListener("touchend", end, {passive:false});
  d.addEventListener("touchcancel", end, {passive:false});
}

/* ================================================================ trackpad */
const pad = $("#pad");
const T = new Map(); let g = null, lastTap = {t:0, x:0, y:0};
const TAP_MS = 250, SLOP = 10, DTAP_MS = 300, EDGE = 34;
const centroid = () => { let x = 0, y = 0; for (const p of T.values()){ x += p.x; y += p.y; } return {x: x / T.size, y: y / T.size}; };
function initPad(){
  pad.querySelector(".su").innerHTML = svg("chevup", 16, 2.2);
  pad.querySelector(".sd").innerHTML = svg("chevdown", 16, 2.2);
  if (load("mando.hinted")) $("#hint").style.display = "none";

  const glow = $("#glow"), pr = () => pad.getBoundingClientRect();
  const moveGlow = t => { const r = pr(); glow.style.transform = `translate(${t.clientX - r.left}px,${t.clientY - r.top}px)`; };
  pad.addEventListener("touchstart", e => {
    e.preventDefault(); inertia = null;
    moveGlow(e.touches[0]); pad.classList.add("touching");
    const now = performance.now();
    for (const t of e.changedTouches) T.set(t.identifier, {x:t.clientX, y:t.clientY, sx:t.clientX, sy:t.clientY});
    if (!g){
      const t = e.changedTouches[0], r = pad.getBoundingClientRect();
      g = {start:now, last:now, max:0, moved:false, mode:"none", drag:false, fx:t.clientX, fy:t.clientY, accD:0, accC:0, z:0, vx:0, vy:0};
      if (!load("mando.hinted")){ $("#hint").style.opacity = 0; save("mando.hinted", true); }
      const atEdge = S.left ? (t.clientX - r.left < EDGE) : (r.right - t.clientX < EDGE);
      if (atEdge && T.size === 1){ g.mode = "edge"; pad.classList.add("edge"); buzz(HAP.edge); }
      else if (T.size === 1 && now - lastTap.t < DTAP_MS && Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) < 40){
        g.drag = true; send({t:"bd", b:"l"}); buzz(HAP.grab);
      }
    }
    g.max = Math.max(g.max, T.size);
    if (T.size === 3){ g.c3 = centroid(); g.c3now = g.c3; }
  }, {passive:false});

  pad.addEventListener("touchmove", e => {
    e.preventDefault(); if (!g) return;
    if (e.touches[0]) moveGlow(e.touches[0]);
    const now = performance.now(), prev = new Map();
    for (const [id, p] of T) prev.set(id, {x:p.x, y:p.y});
    for (const t of e.changedTouches){
      const p = T.get(t.identifier); if (!p) continue;
      p.x = t.clientX; p.y = t.clientY;
      if (Math.hypot(p.x - p.sx, p.y - p.sy) > SLOP) g.moved = true;
    }
    const dt = Math.max(1, now - g.last); g.last = now;
    const n = T.size;
    if (g.mode === "edge"){
      if (n !== 1) return;
      const [id, p] = T.entries().next().value, q = prev.get(id);
      const wy = -(p.y - q.y) * S.scroll / 24;          // como una barra de desplazamiento
      sy += wy; g.vy = 0.7 * g.vy + 0.3 * (wy / dt);
      return;
    }
    if (n === 1){
      if (g.max > 1) return;
      const [id, p] = T.entries().next().value, q = prev.get(id);
      const dx = p.x - q.x, dy = p.y - q.y, v = Math.hypot(dx, dy) / dt;
      const gain = S.sens * (0.4 + S.accel * Math.min(v, 2.5));
      mx += dx * gain; my += dy * gain; g.mode = "move";
    } else if (n === 2 && g.max === 2){
      const [a, b] = [...T.values()], [qa, qb] = [...prev.values()];
      const cdx = ((a.x + b.x) - (qa.x + qb.x)) / 2, cdy = ((a.y + b.y) - (qa.y + qb.y)) / 2;
      const d = Math.hypot(a.x - b.x, a.y - b.y), qd = Math.hypot(qa.x - qb.x, qa.y - qb.y);
      if (g.mode !== "scroll" && g.mode !== "pinch"){
        g.accD += d - qd; g.accC += Math.hypot(cdx, cdy);
        if (Math.abs(g.accD) > 25 && Math.abs(g.accD) > g.accC) g.mode = "pinch";
        else if (g.accC > 8) g.mode = "scroll";
      }
      if (g.mode === "scroll"){
        const k = S.scroll / 30, dir = S.natural ? 1 : -1;
        const wy = dir * cdy * k, wx = -dir * cdx * k;
        sy += wy; sx += wx;
        g.vy = 0.7 * g.vy + 0.3 * (wy / dt); g.vx = 0.7 * g.vx + 0.3 * (wx / dt);
      } else if (g.mode === "pinch"){
        g.z += (d - qd) / 45;
        while (Math.abs(g.z) >= 1){ const s = Math.sign(g.z); send({t:"z", d:s}); g.z -= s; buzz(HAP.tick); }
      }
    } else if (n === 3){ g.mode = "three"; g.c3now = centroid(); }
  }, {passive:false});

  const end = e => {
    e.preventDefault(); if (!g) return;
    for (const t of e.changedTouches) T.delete(t.identifier);
    if (T.size > 0) return;
    const dur = performance.now() - g.start;
    pad.classList.remove("edge", "touching");
    if (g.drag){ send({t:"bu", b:"l"}); lastTap.t = 0; buzz(HAP.drop); }
    else if (!g.moved && dur < TAP_MS){
      if (g.max === 1){ send({t:"c", b:"l"}); lastTap = {t:performance.now(), x:g.fx, y:g.fy}; buzz(HAP.click); }
      else if (g.max === 2){ send({t:"c", b:"r"}); buzz(HAP.right); }
      else { send({t:"c", b:"m"}); buzz(HAP.middle); }
    } else if (g.mode === "three" && g.c3){
      const dx = g.c3now.x - g.c3.x, dy = g.c3now.y - g.c3.y;
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 50){ sendKeys(dy < 0 ? "win+tab" : "win+d"); buzz(HAP.gesture); }
      else if (Math.abs(dx) > 50){ sendKeys(dx < 0 ? "ctrl+win+right" : "ctrl+win+left"); buzz(HAP.gesture); }
    } else if ((g.mode === "scroll" || g.mode === "edge") && S.inertia && Math.hypot(g.vx, g.vy) > 0.01){
      inertia = {x:g.vx, y:g.vy};
    }
    g = null;
  };
  pad.addEventListener("touchend", end, {passive:false});
  pad.addEventListener("touchcancel", end, {passive:false});
}

/* ================================================================ menú radial */
const ACTIONS = {
  apps:  {label:"TV", icon:"tv", run:() => openTV()},
  vol:   {label:tr("Volumen"), icon:"vol", run:() => toggleMute()},
  desk:  {label:tr("Escritorio"), icon:"desk", run:() => sendKeys("win+d")},

  lock:  {label:tr("Bloquear el PC"), icon:"lock", run:() => send({t:"power", a:"lock"})},
  power: {label:tr("Energía"), icon:"power", run:() => openPower()},
};
const RAD = {open:false, mode:null, hot:null, items:[], moved:false, sx:0, sy:0, volY:null, volSteps:0, cx:0, cy:0};
const radial = $("#radial"), fab = $("#fab");

function openRadial(){
  const r = fab.getBoundingClientRect();
  RAD.cx = r.left + r.width / 2; RAD.cy = r.top + r.height / 2;
  radial.style.setProperty("--fx", RAD.cx + "px"); radial.style.setProperty("--fy", RAD.cy + "px");
  radial.querySelectorAll(".ritem,.bubble").forEach(n => n.remove());
  const R = Math.min(142, innerWidth * 0.36), angles = [162, 126, 90, 54, 18];
  const ids = DEF.radial.slice(0, 4).concat("power");
  RAD.items = ids.map((id, i) => {
    const a = angles[i] * Math.PI / 180, x = RAD.cx + R * Math.cos(a), y = RAD.cy - R * Math.sin(a);
    const b = document.createElement("button");
    b.className = "ritem"; b.dataset.id = id; b.setAttribute("aria-label", ACTIONS[id].label);
    b.innerHTML = svg(ACTIONS[id].icon, 24);
    b.style.left = (x - 30) + "px"; b.style.top = (y - 30) + "px";
    b.style.setProperty("--ox", (RAD.cx - x) + "px"); b.style.setProperty("--oy", (RAD.cy - y) + "px");
    b.style.setProperty("--delay", (i * 35) + "ms");
    bindRadialItem(b, id);
    radial.appendChild(b);
    return {id, el:b, x, y};
  });
  radial.classList.add("open"); document.body.classList.add("radial"); $("#kbdchip").classList.remove("on");
  requestAnimationFrame(() => requestAnimationFrame(() => radial.classList.add("show")));
  RAD.open = true; RAD.hot = null; VOL.drag = null; hideVolBar(); renderVol();
  if (document.documentElement.dataset.theme === "aero") spawnBubbles();
  buzz(HAP.open);
}
function closeRadial(){
  if (!RAD.open) return;
  RAD.open = false; RAD.mode = null; setHot(null); hideVolBar(); VOL.drag = null;
  if (CARET) setTimeout(() => onCaret(true), 250);
  radial.classList.remove("show"); document.body.classList.remove("radial");
  setTimeout(() => { if (!RAD.open) radial.classList.remove("open"); }, 180);
}
function spawnBubbles(){
  for (let i = 0; i < 9; i++){
    const b = document.createElement("span"), s = 6 + Math.random() * 12;
    b.className = "bubble";
    b.style.cssText = `left:${RAD.cx - s / 2}px;top:${RAD.cy - s / 2}px;width:${s}px;height:${s}px;--bx:${(Math.random() - .5) * 220}px;--by:${-60 - Math.random() * 200}px;animation-delay:${Math.random() * 160}ms`;
    radial.appendChild(b); setTimeout(() => b.remove(), 1400);
  }
}
function setHot(id){
  if (RAD.hot === id) return;
  RAD.hot = id;
  const label = $("#rlabel");
  RAD.items.forEach(it => it.el.classList.toggle("hot", it.id === id));
  if (id !== "vol" && RAD.mode === "hold") hideVolBar();
  if (!id){ label.style.display = "none"; return; }
  const it = RAD.items.find(i => i.id === id);
  label.textContent = ACTIONS[id].label; label.style.display = "block";
  label.style.left = it.x + "px"; label.style.top = (it.y - 66) + "px";
  if (id === "vol") showVolBar();
  buzz(HAP.hover);
}
function hitItem(x, y){
  let best = null, bd = 48;
  for (const it of RAD.items){ const d = Math.hypot(it.x - x, it.y - y); if (d < bd){ bd = d; best = it.id; } }
  return best;
}
function flash(el, cls){ el.classList.add(cls); clearTimeout(el["_" + cls]); el["_" + cls] = setTimeout(() => el.classList.remove(cls), 140); }
function bindRadialItem(b, id){
  // modo toque: el menú se queda abierto y se pulsa cada opción
  let opened = false;
  b.addEventListener("touchstart", e => {
    e.preventDefault(); e.stopPropagation();
    if (RAD.mode !== "tap") return;
    if (id === "vol"){                                 // 1er toque: barra · siguientes: silenciar · arrastrar: ajustar
      opened = !VOL.shown; setHot("vol"); showVolBar(); volDragStart(e.targetTouches[0].clientY);
      return;
    }
    setHot(id);
  }, {passive:false});
  b.addEventListener("touchmove", e => {
    e.preventDefault();
    if (RAD.mode === "tap" && id === "vol") volDragMove(e.targetTouches[0].clientY);
  }, {passive:false});
  b.addEventListener("touchend", e => {
    e.preventDefault(); e.stopPropagation();
    if (RAD.mode !== "tap") return;
    if (id === "vol"){ if (!VOL.adjusted && !opened) toggleMute(); volDragEnd(); return; }
    const run = ACTIONS[id].run; closeRadial(); buzz(HAP.select); run();
  }, {passive:false});
}
function initRadial(){
  fab.querySelector(".dots").innerHTML = svg("dots", 24);
  fab.querySelector(".x").innerHTML = svg("close", 24, 2.4);
  initVolBar();
  fab.addEventListener("touchstart", e => {
    e.preventDefault();
    if (RAD.open){ closeRadial(); return; }
    const t = e.targetTouches[0];
    openRadial(); RAD.mode = "hold"; RAD.moved = false; RAD.sx = t.clientX; RAD.sy = t.clientY;
  }, {passive:false});
  fab.addEventListener("touchmove", e => {
    e.preventDefault(); if (!RAD.open || RAD.mode !== "hold") return;
    const t = e.targetTouches[0];
    if (Math.hypot(t.clientX - RAD.sx, t.clientY - RAD.sy) > 14) RAD.moved = true;
    if (RAD.hot === "vol" && VOL.adjusted){ volDragMove(t.clientY); return; }   // ya ajustando: se queda en volumen
    const h = hitItem(t.clientX, t.clientY);
    if (h === "vol" && RAD.hot !== "vol"){ setHot("vol"); volDragStart(t.clientY); return; }
    if (h === "vol"){ volDragMove(t.clientY); return; }
    if (!(RAD.hot === "vol" && h === null && VOL.shown)) setHot(h);
  }, {passive:false});
  const end = e => {
    e.preventDefault(); if (!RAD.open || RAD.mode !== "hold") return;
    if (!RAD.moved){ RAD.mode = "tap"; return; }               // toque: el menú se queda abierto
    const id = RAD.hot;
    if (id === "vol"){                                          // soltar en volumen: si se ajustó, se cierra; si no, queda la barra
      volDragEnd();
      if (VOL.adjusted) closeRadial(); else RAD.mode = "tap";
      return;
    }
    closeRadial();
    if (id){ buzz(HAP.select); ACTIONS[id].run(); }
  };
  fab.addEventListener("touchend", end, {passive:false});
  fab.addEventListener("touchcancel", end, {passive:false});
  radial.addEventListener("touchstart", e => { if (e.target === radial){ e.preventDefault(); closeRadial(); } }, {passive:false});
}

/* ---------------- energía: bloquear, suspender, reiniciar, apagar */
const POWER = [
  {a:"lock",     label:tr("Bloquear"),  icon:"lock",    hold:false},
  {a:"sleep",    label:tr("Suspender"), icon:"moon",    hold:true},
  {a:"restart",  label:tr("Reiniciar"), icon:"reload",  hold:true},
  {a:"shutdown", label:tr("Apagar"),    icon:"power",   hold:true, danger:true},
];
const HOLD_MS = 900;
let pwTimer = null;
function openPower(){
  clearInterval(pwTimer);
  openSheet(tr("Energía"), body => renderPower(body));
}
function renderPower(body){
  body.innerHTML = "";
  const grid = document.createElement("div"); grid.className = "pgrid";
  for (const p of POWER){
    const b = document.createElement("button");
    b.className = "btn ptile" + (p.danger ? " danger" : "");
    b.setAttribute("aria-label", p.hold ? tr("{0} (mantén pulsado)", p.label) : p.label);
    b.innerHTML = `<span class="fill"></span>${svg(p.icon, 28)}<span>${p.label}</span>`;
    if (!p.hold){
      b.addEventListener("click", () => { buzz(HAP.select); send({t:"power", a:p.a}); closeSheet(); toast(tr("PC bloqueado")); });
    } else {
      let raf = null, t0 = 0, done = false;
      const fill = b.querySelector(".fill");
      const stop = () => { cancelAnimationFrame(raf); raf = null; if (!done) fill.style.setProperty("--p", 0); b.classList.remove("holding"); };
      const step = now => {
        const k = Math.min(1, (now - t0) / HOLD_MS);
        fill.style.setProperty("--p", k);
        if (k >= 1){ done = true; stop(); confirmPower(p); return; }
        raf = requestAnimationFrame(step);
      };
      b.addEventListener("touchstart", e => { e.preventDefault(); done = false; t0 = performance.now(); b.classList.add("holding"); buzz(HAP.tick); raf = requestAnimationFrame(step); }, {passive:false});
      b.addEventListener("touchend", e => { e.preventDefault(); if (!done && raf) toast(tr("Mantén pulsado para confirmar")); stop(); }, {passive:false});
      b.addEventListener("touchcancel", stop);
      b.addEventListener("contextmenu", e => e.preventDefault());
      // con ratón (pruebas en el ordenador)
      b.addEventListener("mousedown", () => { done = false; t0 = performance.now(); raf = requestAnimationFrame(step); });
      b.addEventListener("mouseup", stop); b.addEventListener("mouseleave", stop);
    }
    grid.appendChild(b);
  }
  body.appendChild(grid);
  const hint = document.createElement("div"); hint.className = "tvhint";
  hint.textContent = tr("Mantén pulsado para suspender, reiniciar o apagar");
  body.appendChild(hint);
}
function confirmPower(p){
  buzz(HAP.close);
  send({t:"power", a:p.a});
  if (p.a === "sleep"){ closeSheet(); toast(tr("Suspendiendo el PC…")); return; }
  // reiniciar / apagar: cuenta atrás con opción de cancelar
  const body = $("#sheetBody"); body.innerHTML = "";
  const verb = tr(p.a === "restart" ? tr("Reiniciando") : tr("Apagando"));
  const box = document.createElement("div"); box.className = "pcount";
  box.innerHTML = `${svg(p.icon, 40)}<div class="pc-t"></div>`;
  const cancel = document.createElement("button"); cancel.className = "btn wide"; cancel.textContent = tr("Cancelar");
  body.append(box, cancel);
  let left = 10;
  const tick = () => { box.querySelector(".pc-t").textContent = tr("{0} el PC en {1} s", verb, left); };
  tick();
  pwTimer = setInterval(() => { left--; if (left <= 0){ clearInterval(pwTimer); box.querySelector(".pc-t").textContent = `${verb}…`; setTimeout(closeSheet, 1200); } else tick(); }, 1000);
  cancel.addEventListener("click", () => { clearInterval(pwTimer); send({t:"power", a:"cancel"}); buzz(HAP.select); toast(tr(p.a === "restart" ? tr("Reinicio cancelado") : tr("Apagado cancelado"))); closeSheet(); });
}

    const row = document.createElement("div"); row.className = "txtrow";
    row.append(keep(iconBtn(tr("Enviar texto"), "send", () => sendTxt(false))), keep(iconBtn(tr("Enviar y pulsar Intro"), "enter", () => sendTxt(true))),

    body.appendChild(row);
    const keys = document.createElement("div"); keys.className = "keys";
    for (const [sym, label, k] of [["⎋","Esc","esc"],["⇥","Tab","tab"],["⌫",tr("Retroceso"),"backspace"],["⌦",tr("Suprimir"),"delete"],["⏎",tr("Intro"),"enter"],

// Línea de desplazamiento: como el borde del trackpad, pero siempre visible
function bindStrip(el){
  el.querySelector(".su").innerHTML = svg("chevup", 16, 2.2);
  el.querySelector(".sd").innerHTML = svg("chevdown", 16, 2.2);
  let y = null, t = 0, vy = 0;
  el.addEventListener("touchstart", e => {
    e.preventDefault(); inertia = null; y = e.touches[0].clientY; t = performance.now(); vy = 0;
    el.classList.add("act"); buzz(HAP.edge);

    const ny = e.touches[0].clientY, now = performance.now(), dt = Math.max(1, now - t);
    const wy = -(ny - y) * S.scroll / 24;

  }, {passive:false});

const SV = {open:false, s:1, tx:0, ty:0, nat:{w:16, h:9}, url:null, loop:0, G:null, holdT:null, loupe:null};
const wrap = $("#stagewrap"), stage = $("#stage"), simg = $("#scrimg"), loupe = $("#loupe");

  closeRadial(); closeSheet();

function closeScreen(){

async function frameLoop(id){
  const [w, q] = {low:[960,45], mid:[1280,60], high:[1920,75]}[S.quality] || [1280,60];
  while (SV.open && SV.loop === id){
    const t0 = performance.now();
    try {
      const r = await fetch(`/screen?k=${encodeURIComponent(token)}&w=${w}&q=${q}`, {cache:"no-store"});
      if (!r.ok) throw new Error(await r.text());
      const u = URL.createObjectURL(await r.blob());

}
function contentRect(){
  const W = wrap.clientWidth, H = wrap.clientHeight, ar = SV.nat.w / SV.nat.h;

  return {W, H, cw, ch, ox, oy};
}
function toFrac(px, py){

function hideLoupe(){ loupe.style.display = "none"; SV.loupe = null; }
function clickAt(f, p){

function initScreen(){
  $("#scrBack").innerHTML = svg("chevleft", 22, 2.2); $("#scrRotate").innerHTML = svg("rotate", 22);

  $("#scrCopy").innerHTML = svg("copy", 22); $("#scrPaste").innerHTML = svg("paste", 22);

  });

    e.preventDefault();

    if (ts.length === 1){

      clearTimeout(SV.holdT);
      if (S.lupa) showLoupe(p);
      else SV.holdT = setTimeout(() => { if (SV.G && !SV.G.moved){ SV.G.mode = "loupe"; showLoupe(SV.G.p); buzz(10); } }, 320);
    } else if (ts.length === 2){

/* ================================================================ trackpad ajustable */
const isLand = () => innerWidth > innerHeight;
function applyReach(){
  const r = Math.max(0, S.reach || 0);
  document.documentElement.style.setProperty("--reach", r + "px");
  // en horizontal: ancho del trackpad (mitad de la pantalla ± lo que se haya arrastrado)
  const w = Math.max(240, Math.min(innerWidth - 300, innerWidth / 2 - (S.reachL || 0)));
  document.documentElement.style.setProperty("--rw", w + "px");
}
function clampReach(){
  const h = pad.getBoundingClientRect().height;
  if (!isLand() && h < 140 && S.reach > 0){ S.reach = Math.max(0, S.reach - (140 - h)); saveS(); }
  applyReach();
}
function initReach(){
  const grip = $("#grip"); grip.innerHTML = "<i></i>";
  applyReach();
  let y0 = 0, ys = 0, yl = 0, r0 = 0, max = 0, armed = false, timer = null, lastTap = 0, land = false;
  const coord = t => land ? t.clientX : t.clientY;    // en horizontal la barrita se arrastra de lado
  grip.addEventListener("touchstart", e => {
    e.preventDefault(); e.stopPropagation();
    land = isLand(); ys = yl = coord(e.touches[0]); armed = false; grip.classList.add("pressing");
    timer = setTimeout(() => {                         // mantener 0,4 s: así no se mueve sin querer
      armed = true; y0 = yl;
      if (land) r0 = S.reachL || 0; else { r0 = S.reach || 0; max = r0 + pad.getBoundingClientRect().height - 150; }
      grip.classList.add("act"); buzz(HAP.grab);
    }, 400);
  }, {passive:false});
  grip.addEventListener("touchmove", e => {
    e.preventDefault(); e.stopPropagation();
    yl = coord(e.touches[0]);
    if (!armed){ if (Math.abs(yl - ys) > 12){ clearTimeout(timer); grip.classList.remove("pressing"); } return; }
    if (land){
      const lo = innerWidth / 2 - (innerWidth - 300), hi = innerWidth / 2 - 240;   // límites del ancho
      const dir = S.padSide === "left" ? -1 : 1;
      const v = Math.round(Math.max(lo, Math.min(hi, r0 + (yl - y0) * dir)));
      if (v !== S.reachL){ if (Math.floor(v / 40) !== Math.floor((S.reachL || 0) / 40)) buzz(HAP.tick); S.reachL = v; applyReach(); }
      return;
    }
    const v = Math.round(Math.max(0, Math.min(max, r0 + yl - y0)));
    if (v !== S.reach){ if (Math.floor(v / 40) !== Math.floor((S.reach || 0) / 40)) buzz(HAP.tick); S.reach = v; applyReach(); }

    else if (Math.abs(yl - ys) < 12){                  // doble toque: tamaño completo
      const n = Date.now();
      if (n - lastTap < 350 && (land ? S.reachL : S.reach)){ if (land) S.reachL = 0; else S.reach = 0; applyReach(); saveS(); toast(tr("Trackpad a tamaño normal")); }

}
