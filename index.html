  if (!$("#winflow").classList.contains("on")) return;
  const track = $("#winflow .wf-track"); track.innerHTML = "";
  WF.list = list; WF.nodes = list.map(w => { const n = wfIcon(w); track.appendChild(n); return n; });
  const n = list.length;
  WF.idx = n ? (((n > 1 ? 1 : 0) + WF.pend) % n + n) % n : 0;
  wfRender();
}
function wfStep(d){
  if (!WF.list.length){ WF.pend += d; return; }
  const n = WF.list.length; WF.idx = ((WF.idx + d) % n + n) % n; wfRender();
}
function wfRender(){
  const n = WF.list.length;
  WF.nodes.forEach((nd, k) => {
    let d = k - WF.idx; if (d > n / 2) d -= n; if (d < -n / 2) d += n;
    nd.style.setProperty("--d", d);
    nd.style.setProperty("--s", d === 0 ? 1 : 0.7);
    nd.style.setProperty("--o", d === 0 ? 1 : Math.abs(d) === 1 ? 0.5 : 0);
  });
  const w = WF.list[WF.idx];
  $("#winflow .wf-name").textContent = w ? w.title : "";
}

/* ================================================================ teclado cuando hay un cuadro de texto activo en el PC */
let CARET = false;
function onCaret(on){
  CARET = on;
  const chip = $("#kbdchip");
  if (!(on && S.autoKbd) || $("#sheet").classList.contains("open") || RAD.open){ chip.classList.remove("on"); return; }
  const ref = SV.open ? $(".sdock") : $("#clicks");
  chip.style.bottom = (innerHeight - ref.getBoundingClientRect().top + 14) + "px";
  if (!chip.classList.contains("on")){ chip.classList.add("on"); buzz(HAP.hover); }
}
function initKbdChip(){
  const chip = $("#kbdchip");
  chip.innerHTML = svg("kbd", 22) + `<span>${tr("Escribir")}</span>`;
  chip.addEventListener("click", () => { buzz(HAP.press); chip.classList.remove("on"); openKeyboard(); });
}

/* ================================================================ volumen: barra como la del móvil */
const VOL = {level:null, mute:false, est:50, shown:false, drag:null, adjusted:false, last:0, t:0};
const volLevel = () => VOL.level ?? VOL.est;
function onVol(m){
  if (m.level != null && !VOL.drag) VOL.level = m.level;
  if (m.mute != null) VOL.mute = m.mute;
  renderVol();
}
function renderVol(){
  const bar = $("#volbar"), val = $("#volval"), lv = Math.round(volLevel());
  bar.style.setProperty("--v", lv); bar.classList.toggle("muted", VOL.mute);
  val.textContent = VOL.mute ? tr("Silencio") : (VOL.level == null ? "" : lv + " %");
  val.style.display = VOL.shown && val.textContent ? "block" : "none";
  const it = RAD.items.find(i => i.id === "vol");
  if (it) it.el.innerHTML = svg(VOL.mute ? "mute" : "vol", 24);
}
function showVolBar(){
  const it = RAD.items.find(i => i.id === "vol"); if (!it) return;
  const bar = $("#volbar"), val = $("#volval"), top = Math.max(76, it.y - 46 - 220);
  bar.style.left = it.x + "px"; bar.style.top = top + "px";
  val.style.left = it.x + "px"; val.style.top = (top - 36) + "px";
  if (!VOL.shown){ bar.classList.add("on"); requestAnimationFrame(() => requestAnimationFrame(() => bar.classList.add("show"))); }
  VOL.shown = true; $("#rlabel").style.display = "none";
  send({t:"vol", get:1}); renderVol();
}
function hideVolBar(){ VOL.shown = false; $("#volbar").classList.remove("show", "on"); $("#volval").style.display = "none"; }
// arrastre relativo: desde cualquier altura, a partir del volumen actual
function volDragStart(y){ VOL.drag = {y0:y, l0:volLevel()}; VOL.adjusted = false; }
function volDragMove(y){
  if (!VOL.drag) return;
  const prev = Math.round(volLevel());
  const lv = Math.max(0, Math.min(100, VOL.drag.l0 + (VOL.drag.y0 - y) / 220 * 100));
  if (VOL.level == null){                              // sin volumen exacto: pasos de 2 % con las teclas
    const steps = Math.round((lv - VOL.est) / 2);
    if (steps){ send({t:"vol", step:steps}); VOL.est = Math.max(0, Math.min(100, VOL.est + steps * 2)); VOL.adjusted = true; VOL.mute = false; }
  } else if (Math.round(lv) !== VOL.level){
    VOL.level = Math.round(lv); VOL.adjusted = true;
    if (VOL.mute){ VOL.mute = false; send({t:"vol", mute:false}); }
    const go = () => { VOL.last = performance.now(); send({t:"vol", set:VOL.level}); };
    clearTimeout(VOL.t); if (performance.now() - VOL.last > 60) go(); else VOL.t = setTimeout(go, 60);
  }
  if (Math.floor(volLevel() / 10) !== Math.floor(prev / 10)) buzz(HAP.tick);
  renderVol();
}
function volDragEnd(){ VOL.drag = null; }
function toggleMute(){ VOL.mute = !VOL.mute; send({t:"vol", mute:VOL.mute}); buzz(HAP.select); renderVol(); }
function initVolBar(){
  const bar = $("#volbar");
  bar.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); volDragStart(e.touches[0].clientY); }, {passive:false});
  bar.addEventListener("touchmove", e => { e.preventDefault(); e.stopPropagation(); volDragMove(e.touches[0].clientY); }, {passive:false});
  const end = e => { e.stopPropagation(); volDragEnd(); };
  bar.addEventListener("touchend", end); bar.addEventListener("touchcancel", end);
}

/* ================================================================ tutorial */
const TUT = [
  {sel:"#pad",    t:tr("Tu ratón"),                 p:tr("Pruébalo: desliza un dedo para mover el cursor y toca para hacer clic. Con dos dedos, desplazas."), f:"f-move"},
  {sel:"#clicks", t:tr("Clic izquierdo y derecho"), p:tr("Pruébalo. Para arrastrar, mantén uno pulsado y mueve con otro dedo en el trackpad."), f:"f-click"},
  {sel:"#dial",   t:tr("Cambiar de ventana"),       p:tr("Pruébalo: toca para volver a la anterior, o mantén y desliza para ver tus ventanas."), f:"f-dial", place:"bottom"},
  {sel:"#card",   t:tr("Lo que tienes delante"),    p:tr("Muestra la app activa y sus botones cambian según lo que uses. Tócala para ver la pantalla del PC."), f:"f-tap"},
  {sel:"#fab",    t:tr("Menú rápido"),              p:tr("Pruébalo: mantén y desliza hasta una opción. TV, volumen, escritorio, teclado y energía."), f:"f-radial", r:"50%", pad:4},
  {sel:"#grip",   t:tr("A tu medida"),              p:tr("Mantén la barrita un momento y arrástrala hacia abajo para acercarlo todo a tu pulgar. Si dudas, mantén pulsado un botón para ver su nombre."), f:"f-drag", r:"999px", pad:2},
];
const tutOn = () => !!$("#tut") && $("#tut").classList.contains("on");
let tutI = 0;
function initTutorial(){
  const tut = document.createElement("div"); tut.id = "tut"; tut.setAttribute("role", "dialog"); tut.setAttribute("aria-modal", "true");
  tut.innerHTML = `<div id="tblock"></div><div id="tspot"><span id="tfinger"></span></div>
    <div id="tcard" aria-live="polite"><div class="tstep"></div><h3></h3><p></p>
      <div class="trow"><div class="tdots">${TUT.map(() => "<i></i>").join("")}</div>
      <div class="tbtns"><button id="tskip">${tr("Saltar")}</button><button id="tnext">${tr("Siguiente")}</button></div></div></div>`;
  document.body.appendChild(tut);
  const next = () => { buzz(HAP.press); if (tutI >= TUT.length - 1) endTutorial(); else showStep(tutI + 1); };
  $("#tnext").addEventListener("click", e => { e.stopPropagation(); next(); });
  $("#tskip").addEventListener("click", e => { e.stopPropagation(); endTutorial(); });
  // fuera del foco, tocar avanza; dentro del foco se usa la app de verdad
  $("#tblock").addEventListener("click", () => next());
  $("#tblock").addEventListener("touchmove", e => e.preventDefault(), {passive:false});
  document.addEventListener("touchend", e => {
    if (!tutOn()) return;
    const el = $(TUT[tutI].sel);
    if (el && el.contains(e.target)){ const c = $("#tcard"); if (!c.classList.contains("tried")){ c.classList.add("tried"); c.querySelector(".tstep").textContent = tr("¡Eso es!"); } }
  }, {capture: true, passive: true});
  addEventListener("resize", () => { if (tut.classList.contains("on")) showStep(tutI, true); });
}
function startTutorial(){
  closeSheet(); closeRadial(); if (SV.open) closeScreen();
  $("#tut").classList.add("on"); document.body.classList.add("tut"); showStep(0);
}
function showStep(i, quiet){
  tutI = i;
  const st = TUT[i], el = $(st.sel); if (!el) return;
  const r = el.getBoundingClientRect(), pd = st.pad ?? 8;
  const spot = $("#tspot"), card = $("#tcard"), finger = $("#tfinger");
  spot.style.left = (r.left - pd) + "px"; spot.style.top = (r.top - pd) + "px";
  spot.style.width = (r.width + pd * 2) + "px"; spot.style.height = (r.height + pd * 2) + "px";
  spot.style.borderRadius = st.r || getComputedStyle(el).borderRadius || "28px";
  card.querySelector(".tstep").textContent = tr("{0} de {1}", i + 1, TUT.length);
  card.querySelector("h3").textContent = st.t;
  card.querySelector("p").textContent = st.p;
  $("#tnext").textContent = tr(i === TUT.length - 1 ? tr("Empezar") : tr("Siguiente"));
  $("#tskip").style.visibility = i === TUT.length - 1 ? "hidden" : "visible";
  card.querySelectorAll(".tdots i").forEach((d, k) => d.classList.toggle("on", k === i));
  // la tarjeta va donde haya sitio: encima del elemento si cabe, si no debajo
  const ch = card.offsetHeight || 190, H = innerHeight, gap = 18;
  let top = r.top - pd - gap - ch;
  if (top < 12) top = r.bottom + pd + gap;
  if (top + ch > H - 12) top = Math.max(12, Math.min(H - ch - 12, r.top + 24));
  if (st.place === "bottom") top = H - ch - 16;
  const L = r.left - pd, T = r.top - pd, R = r.right + pd, B = r.bottom + pd;
  $("#tblock").style.clipPath = `polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, ${L}px ${T}px, ${R}px ${T}px, ${R}px ${B}px, ${L}px ${B}px, ${L}px ${T}px)`;
  document.body.classList.toggle("tut-fab", st.sel === "#fab");
  if (!quiet) card.classList.remove("tried");
  card.style.top = top + "px";
  finger.className = ""; void finger.offsetWidth; finger.className = st.f;
  if (!quiet){ replay(card, "swap"); buzz(HAP.hover); }
}
function endTutorial(){
  $("#tut").classList.remove("on"); document.body.classList.remove("tut", "tut-fab"); save("mando.tutorial", 1); buzz(HAP.select);
}

/* ================================================================ arranque */
function init(){
  translateStatic();
  applyTheme();
  initFullscreen();
  $("#btnSettings").innerHTML = svg("settings", 20);
  onTap($("#btnSettings"), openSettings);
  $("#sheetClose").innerHTML = svg("close", 20, 2.2);
  $("#sheetClose").addEventListener("click", closeSheet);
  $("#scrim").addEventListener("click", closeSheet);
  initCard(); initDial(); initPad(); initClicks(); initRadial(); initScreen(); initReach(); initTutorial(); initKbdChip();
  if (!load("mando.tutorial")) setTimeout(startTutorial, 700);
  connect();
}
init();
