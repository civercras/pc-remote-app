# Builds MandoPC.exe on Windows for every version tag (v*) or when run manually from the Actions tab.
name: Build MandoPC.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name MandoPC
          --icon icon.ico
          --add-data "index.html;."
          --add-data "icon.png;."
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32
          server.py

      - uses: actions/upload-artifact@v4
        with:
          name: MandoPC
          path: dist/MandoPC.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MandoPC.exe
          name: Mando PC ${{ github.ref_name }}
          body_path: .github/RELEASE.md
