# Builds MandoPC.exe on Windows.
# On every push to main it reads VERSION from server.py; if there is no release
# for that version yet, it creates the tag and publishes the release with the .exe.
name: Build MandoPC.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: bash
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' server.py)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name MandoPC
          --icon icon.ico
          --add-data "index.html;."
          --add-data "icon.png;."
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32
          server.py

      - uses: actions/upload-artifact@v4
        with:
          name: MandoPC
          path: dist/MandoPC.exe

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mando PC ${{ steps.v.outputs.tag }}
          body_path: .github/RELEASE.md
          files: dist/MandoPC.exe
